apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apps.paas.ham.dev
spec:
  group: paas.ham.dev
  names:
    kind: App
    plural: apps
    singular: app
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                port:
                  type: integer
              required: ["image", "replicas", "port"]
            status:
              type: object
              properties:
                ready:
                  type: boolean
                lastSyncedAt:
                  type: string
      subresources:
        status: {}